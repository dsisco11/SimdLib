name: Validation

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-msvc:
    name: Windows | MSVC | Native
    runs-on: windows-2022
    steps:
      - name: Source | Check out repository
        uses: actions/checkout@v4
      - name: Validation | Build targets
        run: tools/Build.ps1 -Scope Native -Compiler Msvc
      - name: Validation | Run tests
        run: tools/Run-Tests.ps1 -Scope Native -Compiler Msvc
      - name: Evidence | Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msvc-evidence
          path: |
            out/pipeline/windows-msvc/**/provenance
            out/pipeline/windows-msvc/**/reports
            out/pipeline/windows-msvc/**/validation-build.manifest
            out/pipeline/windows-msvc/**/build/register-codegen/**/*.json
            out/pipeline/windows-msvc/**/build/register-codegen/**/*.txt
            out/pipeline/windows-msvc/**/build/method-flags-codegen/**/*.json
            out/pipeline/windows-msvc/**/build/method-flags-codegen/**/*.txt
            out/pipeline/logs
            out/pipeline/provenance
          if-no-files-found: error

  windows-clang20-container:
    name: Windows | clang-cl 20 | Container
    runs-on: windows-2022
    steps:
      - name: Source | Check out repository
        uses: actions/checkout@v4
      - name: Image | Restore cached archive
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/windows-clang20.tar
          key: windows-2022-amd64-clang20-image-v1-${{ hashFiles('containers/Dockerfile.windows-clang20', '.dockerignore') }}
      - name: Image | Load cached archive
        if: steps.compiler-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          docker load --input "$env:RUNNER_TEMP/windows-clang20.tar"
          if ($LASTEXITCODE -ne 0) { throw 'Compiler image load failed' }
      - name: Image | Build and archive compiler environment
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          docker build --isolation=process --memory 4GB `
            --file containers/Dockerfile.windows-clang20 `
            --tag simdlib/windows-clang20:local .
          if ($LASTEXITCODE -ne 0) { throw 'Compiler image build failed' }

          docker save --output "$env:RUNNER_TEMP/windows-clang20.tar" `
            simdlib/windows-clang20:local
          if ($LASTEXITCODE -ne 0) { throw 'Compiler image archive failed' }
      # Save before compilation so source failures do not discard the environment.
      - name: Image | Save archive to cache
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/windows-clang20.tar
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Validation | Build targets
        run: tools/Run-WindowsClang20Container.ps1 -Action Build -SkipImageBuild
      - name: Validation | Run tests
        run: tools/Run-WindowsClang20Container.ps1 -Action Test -SkipImageBuild
      - name: Evidence | Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang20-evidence
          path: |
            out/pipeline/windows-clangcl/**/provenance
            out/pipeline/windows-clangcl/**/reports
            out/pipeline/windows-clangcl/**/validation-build.manifest
            out/pipeline/windows-clangcl/**/build/register-codegen/**/*.json
            out/pipeline/windows-clangcl/**/build/register-codegen/**/*.txt
            out/pipeline/windows-clangcl/**/build/partial-register-codegen/**/*.json
            out/pipeline/windows-clangcl/**/build/partial-register-codegen/**/*.txt
            out/pipeline/windows-clangcl/**/build/method-flags-codegen/**/*.json
            out/pipeline/windows-clangcl/**/build/method-flags-codegen/**/*.txt
            out/pipeline/logs
            out/pipeline/provenance
          if-no-files-found: error

  native-clang22:
    name: Windows | Clang 22 + coverage | Native
    runs-on: windows-2022
    steps:
      - name: Source | Check out repository
        uses: actions/checkout@v4
      - name: Toolchain | Install compiler environment
        shell: pwsh
        run: |
          choco upgrade cmake --version=4.4.0 --yes --allow-downgrade --no-progress --limit-output
          if ($LASTEXITCODE -notin @(0, 1605, 1614, 1641, 3010)) {
            throw "Chocolatey failed to install CMake 4.4.0 with exit code $LASTEXITCODE"
          }
          choco upgrade llvm --version=22.1.7 --yes --allow-downgrade --no-progress --limit-output
          if ($LASTEXITCODE -notin @(0, 1605, 1614, 1641, 3010)) {
            throw "Chocolatey failed to install LLVM 22.1.7 with exit code $LASTEXITCODE"
          }
          'C:\Program Files\CMake\bin' | Out-File -Encoding utf8 -Append $env:GITHUB_PATH
          'C:\Program Files\LLVM\bin' | Out-File -Encoding utf8 -Append $env:GITHUB_PATH
      - name: Toolchain | Verify compiler environment
        run: |
          $cmakeVersion = & 'C:\Program Files\CMake\bin\cmake.exe' --version | Select-Object -First 1
          if ($cmakeVersion -ne 'cmake version 4.4.0') { throw "Unexpected CMake version: $cmakeVersion" }
          $version = & 'C:\Program Files\LLVM\bin\clang-cl.exe' --version | Select-Object -First 1
          if ($version -notmatch 'clang version 22\.1\.7\b') { throw "Unexpected clang-cl version: $version" }
          $cmakeVersion
          $version
      - name: Validation | Build targets
        run: tools/Build.ps1 -Scope Native -Compiler ClangCl,ClangCoverage
      - name: Validation | Run tests
        run: tools/Run-Tests.ps1 -Scope Native -Compiler ClangCl,ClangCoverage
      - name: Evidence | Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang22-evidence
          path: |
            out/pipeline/windows-clangcl/**/provenance
            out/pipeline/windows-clangcl/**/reports
            out/pipeline/windows-clangcl/**/validation-build.manifest
            out/pipeline/windows-clangcl/**/build/register-codegen/**/*.json
            out/pipeline/windows-clangcl/**/build/register-codegen/**/*.txt
            out/pipeline/windows-clangcl/**/build/partial-register-codegen/**/*.json
            out/pipeline/windows-clangcl/**/build/partial-register-codegen/**/*.txt
            out/pipeline/windows-clangcl/**/build/method-flags-codegen/**/*.json
            out/pipeline/windows-clangcl/**/build/method-flags-codegen/**/*.txt
            out/pipeline/windows-clang-coverage/**/provenance
            out/pipeline/windows-clang-coverage/**/reports
            out/pipeline/windows-clang-coverage/**/validation-build.manifest
            out/pipeline/windows-clang-coverage/**/build/method-flags-codegen/**/*.json
            out/pipeline/windows-clang-coverage/**/build/method-flags-codegen/**/*.txt
            out/pipeline/logs
            out/pipeline/provenance
          if-no-files-found: error

  container-compilers:
    name: Linux | ${{ matrix.name }} | Container
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: Gcc13
            service: gcc13
            name: GCC 13
          - compiler: Gcc14
            service: gcc14
            name: GCC 14
          - compiler: Clang22
            service: clang22
            name: Clang 22
    steps:
      - name: Source | Check out repository
        uses: actions/checkout@v4
      - name: Tools | Install Docker Compose
        shell: bash
        env:
          DOCKER_COMPOSE_VERSION: v2.39.0
        run: |
          plugin_dir="${HOME}/.docker/cli-plugins"
          asset_name="docker-compose-linux-x86_64"
          release_url="https://github.com/docker/compose/releases/download/${DOCKER_COMPOSE_VERSION}"
          mkdir -p "${plugin_dir}"
          curl --fail --location --silent --show-error \
            "${release_url}/${asset_name}" \
            --output "${plugin_dir}/docker-compose"
          expected_sha256="$(curl --fail --location --silent --show-error \
            "${release_url}/${asset_name}.sha256" | awk '{print $1}')"
          actual_sha256="$(sha256sum "${plugin_dir}/docker-compose" | awk '{print $1}')"
          test -n "${expected_sha256}"
          test "${actual_sha256}" = "${expected_sha256}"
          chmod +x "${plugin_dir}/docker-compose"
          docker compose version
      - name: Tools | Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Image | Build compiler environment with cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile.${{ matrix.service }}
          tags: simdlib/${{ matrix.service }}:local
          load: true
          provenance: false
          # Include intermediate stages so the compiled CMake toolchain is reusable.
          cache-from: type=gha,version=2,scope=simdlib-${{ matrix.service }}
          cache-to: type=gha,version=2,scope=simdlib-${{ matrix.service }},mode=max,ignore-error=true
      - name: Validation | Build targets
        shell: pwsh
        run: tools/Build.ps1 -Scope Containers -Compiler ${{ matrix.compiler }} -SkipImageBuild
      - name: Validation | Run tests
        shell: pwsh
        run: tools/Run-Tests.ps1 -Scope Containers -Compiler ${{ matrix.compiler }}
      - name: Evidence | Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.service }}-evidence
          path: |
            out/pipeline/linux-*/**/provenance
            out/pipeline/linux-*/**/reports
            out/pipeline/linux-*/**/validation-build.manifest
            out/pipeline/linux-*/**/build/register-codegen/**/*.json
            out/pipeline/linux-*/**/build/register-codegen/**/*.txt
            out/pipeline/linux-*/**/build/method-flags-codegen/**/*.json
            out/pipeline/linux-*/**/build/method-flags-codegen/**/*.txt
            out/pipeline/logs
            out/pipeline/provenance
          if-no-files-found: error
