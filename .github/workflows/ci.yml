name: SimdLib CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: MSVC ${{ matrix.arch }} ${{ matrix.config }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G 'Visual Studio 17 2022' -A '${{ matrix.arch }}' -T v143 `
            -DSIMDLIB_BUILD_TESTS=ON `
            -DSIMDLIB_BUILD_TESTS_OPTIONAL=OFF `
            -DSIMDLIB_BUILD_EXAMPLES=ON `
            -DSIMDLIB_STRICT_WARNINGS=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

  clang-cl:
    name: clang-cl ${{ matrix.arch }} ${{ matrix.config }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Configure standalone clang-cl
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_CXX_COMPILER=clang-cl
          -DSIMDLIB_BUILD_TESTS=ON
          -DSIMDLIB_BUILD_TESTS_OPTIONAL=OFF
          -DSIMDLIB_BUILD_EXAMPLES=ON
          -DSIMDLIB_STRICT_WARNINGS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-containers:
    name: GCC 14 and Clang 22 containers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the full compiler matrix
        shell: pwsh
        run: tools/Run-ContainerMatrix.ps1 -Mode Full
      - name: Run feature-profile tests from the same images
        shell: pwsh
        run: tools/Run-ContainerMatrix.ps1 -Mode Feature -NoBuild
      - name: Run Clang sanitizers from the same image
        shell: pwsh
        run: tools/Run-ContainerMatrix.ps1 -Mode Sanitizer -NoBuild
      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-container-evidence
          path: out/container
          if-no-files-found: error
