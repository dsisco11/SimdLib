name: SimdLib CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-msvc:
    name: MSVC x64 ${{ matrix.preset }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [msvc-debug-diagnostics, msvc-release-exhaustive]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  native-clangcl:
    name: clang-cl x64 ${{ matrix.preset }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [clangcl-debug-diagnostics, clangcl-release-exhaustive]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure standalone clang-cl
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  container-compilers:
    name: GCC 13, GCC 14, and Clang 22 containers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build every Linux validation cell
        shell: pwsh
        run: tools/Run-ContainerMatrix.ps1 -Action Build
      - name: Test every prebuilt Linux validation cell
        shell: pwsh
        run: tools/Run-ContainerMatrix.ps1 -Action Test
      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-container-evidence
          path: out/pipeline
          if-no-files-found: error
